<!doctype html>
<html>
<head><meta charset="utf-8"><title>Job Application for Software Engineer at Acme</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 20px auto; }
  .field { margin: 12px 0; } label { display: block; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style></head>
<body>
<h1>Software Engineer</h1>
<form id="application_form">
  <h2>Submit your application</h2>
  <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input type="text" id="first_name" name="job_application[first_name]" aria-required="true"></div>
  <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input type="text" id="last_name" name="job_application[last_name]" aria-required="true"></div>
  <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input type="text" id="email" name="job_application[email]" aria-required="true"></div>
  <div class="field"><label for="phone">Phone</label><input type="text" id="phone" name="job_application[phone]"></div>
  <div class="field"><label for="loc">Location (City)</label><input type="text" id="loc" name="job_application[location]"></div>

  <div class="field">
    <div id="resume_label">Resume/CV <span class="asterisk">*</span></div>
    <button type="button">Attach</button>
    <input type="file" id="resume" class="visually-hidden" aria-labelledby="resume_label">
  </div>
  <div class="field">
    <div id="cover_label">Cover Letter</div>
    <button type="button">Attach</button>
    <input type="file" id="cover_letter" class="visually-hidden" aria-labelledby="cover_label">
  </div>

  <div class="field"><label for="q1">LinkedIn Profile</label><input type="text" id="q1" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="q2">Website</label><input type="text" id="q2" name="job_application[answers_attributes][1][text_value]"></div>
  <div class="field"><label for="q3">School <span>*</span></label><input type="text" id="q3"></div>
  <div class="field"><label for="q4">Expected graduation date (MM/YYYY)</label><input type="text" id="q4" placeholder="MM/YYYY"></div>
  <div class="field"><label for="q5">Why do you want to work at Acme? <span>*</span></label><textarea id="q5" required></textarea></div>
  <div class="field"><label for="q6">Name of employee who referred you</label><input type="text" id="q6"></div>
  <div class="field">
    <label for="q7">Are you legally authorized to work in the United States? <span>*</span></label>
    <select id="q7" required><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select>
  </div>
  <div class="field">
    <label for="q8">Will you now or in the future require sponsorship for employment visa status (e.g. H-1B visa status)? <span>*</span></label>
    <select id="q8" required><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select>
  </div>
  <div class="field">
    <label for="q9">Have you previously worked at Acme?</label>
    <select id="q9"><option value="">Please select</option><option>Yes</option><option>No</option></select>
  </div>
  <div class="field">
    <label for="q10">Country</label>
    <select id="q10"><option value="">Select a country</option><option>Canada</option><option>Mexico</option><option value="US">United States of America</option><option>United Kingdom</option></select>
  </div>

  <h2>U.S. Equal Employment Opportunity Information</h2>
  <div class="field"><label for="gender">Gender</label>
    <select id="gender"><option value="">Please select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
  <div class="field"><label for="hispanic">Are you Hispanic/Latino?</label>
    <select id="hispanic"><option value="">Please select</option><option value="1">Yes</option><option value="2">No</option><option value="3">Decline To Self Identify</option></select></div>
  <div class="field"><label for="veteran">Veteran Status</label>
    <select id="veteran"><option value="">Please select</option><option value="1">I am not a protected veteran</option><option value="2">I identify as one or more of the classifications of protected veteran</option><option value="3">I don't wish to answer</option></select></div>
  <div class="field"><label for="disability">Disability Status</label>
    <select id="disability"><option value="">Please select</option><option value="1">Yes, I have a disability, or have had one in the past</option><option value="2">No, I do not have a disability and have not had one in the past</option><option value="3">I do not want to answer</option></select></div>

  <button type="submit" id="submit">Submit Application</button>
</form>
<script>
  window.submitted = false;
  document.getElementById("application_form").addEventListener("submit", (e) => { e.preventDefault(); window.submitted = true; });
</script>
</body>
</html>
